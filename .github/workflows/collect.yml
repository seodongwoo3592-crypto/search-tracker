name: 네이버 검색량 수집

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 한국시간 오전 9시
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집
        id: run
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SEARCHAD_API_KEY: ${{ secrets.SEARCHAD_API_KEY }}
          SEARCHAD_SECRET: ${{ secrets.SEARCHAD_SECRET }}
          SEARCHAD_CUSTOMER_ID: ${{ secrets.SEARCHAD_CUSTOMER_ID }}
          DATALAB_URL: ${{ vars.DATALAB_URL }}
        run: |
          set +e
          python collector/collect.py
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: 데이터 저장(커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "바뀐 데이터가 없어요."
            exit 0
          fi
          git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "::error::푸시에 실패했어요."
          exit 1

      - name: 수집 결과 확인
        if: steps.run.outputs.code != '0'
        run: |
          echo "::error::수집 중 일부가 실패했어요. 위 '수집' 단계의 로그를 확인해 주세요."
          exit 1
